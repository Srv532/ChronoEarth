<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — ChronoEarth</title>
    <meta name="description" content="Log in to explore 4.5 billion years of Earth's history.">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="theme-void">
    <input type="checkbox" id="theme-switch" class="theme-switch" aria-label="Switch between dark and light mode">
    <label for="theme-switch" class="theme-toggle theme-corner"><span class="when-dark">Light mode</span><span class="when-light">Dark mode</span></label>

    <main class="login-page">
        <section class="login-card">
            <img src="images/logo-dark.svg" alt="ChronoEarth logo" class="logo-large logo-dark"><img src="images/logo-light.svg" alt="" class="logo-large logo-light">
            <h1 class="login-brand">ChronoEarth</h1>
            <p class="login-tag">4.5 Billion Years in Every Scroll</p>

            <!-- Shown only when you arrive from a Log out link (index.html#logged-out) -->
            <p id="logged-out" class="login-notice" role="status">✓ You have been logged out.</p>

            <p class="login-lead">Please log in to explore the history of our planet.</p>

            <!-- HTML-only login: the browser blocks submit unless both fields match.
                 The inputs have no name, so nothing is added to the URL. -->
            <form class="login-form" action="home.html" method="get">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required
                       pattern="admin" title="The username is admin">
                <small class="field-error">That username is not recognised.</small>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required
                       pattern="admin" title="The password is admin">
                <small class="field-error">That password is not correct.</small>

                <button type="submit">Log in</button>
            </form>

            <p class="login-demo">Demo account — username <strong>admin</strong>, password <strong>admin</strong></p>
        </section>
    </main>
</body>
</html>
