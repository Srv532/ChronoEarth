<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — ChronoEarth</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="theme-void">
    <input type="checkbox" id="theme-switch" class="theme-switch" aria-label="Switch between dark and light mode">

    <main class="login-page">
        <section class="login-card">
            <img src="../images/logo-dark.svg" alt="ChronoEarth logo" class="logo-large logo-dark"><img src="../images/logo-light.svg" alt="" class="logo-large logo-light">
            <h1>ChronoEarth</h1>
            <p class="login-lead">Please log in to explore 4.5 billion years of Earth's history.</p>

            <!-- HTML-only login: the browser blocks submit unless both fields match.
                 Inputs have no name, so nothing is added to the URL. -->
            <form action="../index.html" method="get">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required
                       pattern="admin" title="Username is admin">

                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required
                       pattern="admin" title="Password is admin">

                <button type="submit">Log in</button>
            </form>
        </section>
    </main>
    <label for="theme-switch" class="theme-toggle floating"><span class="when-dark">Light mode</span><span class="when-light">Dark mode</span></label>
</body>
</html>
